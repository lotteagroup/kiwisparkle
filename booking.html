<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Now | Kiwisparkle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Kiwisparkle home">
        <img src="images/Kiwisparkle Logo.png" alt="Kiwisparkle logo" width="349" height="110">
      </a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html" class="button button-primary">Get Quote</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="section-light">
      <div class="container section-intro">
        <h1>Online Booking</h1>
        <p>Fill out the form below to request your cleaning service. We'll confirm your appointment via email.</p>
      </div>
      <div class="container booking-form-card">
        <form id="booking-form">
          <div class="form-row">
            <div class="form-group">
              <label for="customer-name">Name</label>
              <input type="text" id="customer-name" name="customerName" required />
            </div>
            <div class="form-group">
              <label for="customer-email">Email</label>
              <input type="email" id="customer-email" name="customerEmail" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="customer-phone">Phone</label>
              <input type="tel" id="customer-phone" name="customerPhone" required />
            </div>
            <div class="form-group">
              <label for="service-type">Service Type</label>
              <select id="service-type" name="serviceType" required>
                <option value="">Choose a service</option>
                <option>End of Tenancy Cleans</option>
                <option>Move In / Move Out Cleans</option>
                <option>Post-Renovation / Builders Clean</option>
                <option>Commercial Cleaning</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="service-date">Preferred Date</label>
              <input type="date" id="service-date" name="serviceDate" required />
            </div>
            <div class="form-group">
              <label for="service-time">Preferred Time</label>
              <input type="time" id="service-time" name="serviceTime" required />
            </div>
          </div>
          <div class="form-group">
            <label for="service-frequency">Frequency</label>
            <select id="service-frequency" name="serviceFrequency" required>
              <option value="">Choose frequency</option>
              <option>One-time</option>
              <option>Weekly</option>
              <option>Bi-weekly</option>
              <option>Monthly</option>
            </select>
          </div>
          <div class="form-group">
            <label for="service-address">Service Address</label>
            <input type="text" id="service-address" name="serviceAddress" placeholder="Street, city, zip" required />
          </div>
          <div class="form-group">
            <label for="service-notes">Additional Notes</label>
            <textarea id="service-notes" name="serviceNotes" rows="4" placeholder="Tell us about your needs"></textarea>
          </div>
          <button type="submit" class="button button-primary">Submit Booking Request</button>
          <p id="booking-message" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Kiwisparkle.</p>
      <p><a href="contact.html">Contact us</a></p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
